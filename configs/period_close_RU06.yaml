# steps: omitted — all steps from base.yaml run in base order.
# Add a steps: list here to control which steps run, their order,
# and any per-step overrides (async, poll_timeout_sec, params, etc.).
#
# Example — run all base steps but override KO8G for a small-orders company:
# steps:
#   - step_id: "Z_FI_COMPARISON"
#   - step_id: "KO8G"
#     async:            false
#     poll_timeout_sec: 1000
#     params:
#       - {selname: "VARIANT", kind: "P", low: "RU06_SMALL"}
#   - step_id: "S_ALR_87013127"
#   ... (continue listing all desired steps)

