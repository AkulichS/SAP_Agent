        - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
        - {selname: "MONAT",  kind: "P", low: "{{period}}"}
        - {selname: "STORNO", kind: "P", low: "X"}   # reverse transfer

    on_error:
      analysis_guidance: |
        Z_FI_TRNSFR is a custom FI data transfer program.
        Verify that source FI data is complete for period {{period}}/{{fiscal_year}}.
        Check BKPF and BSEG for company code {{company_code}}.

################################ 16 — ZFI_SLD_CLOSING ############################
  - step_id:     "ZFI_SLD_CLOSING"
    description: "FI SLD Final Period Closing"
    group:       null
    action_type: "SUBMIT"
    object_name: "ZFI_SLD_CLOSING"
    async:       true
    test_run:    true

    params:
      - {selname: "BUKRS",  kind: "P", low: "{{company_code}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "MONAT",  kind: "P", low: "{{period}}"}
      - {selname: "WAERS",  kind: "P", low: "{{currency}}"}

    pre_check:
      enabled: false

    validate:
      mode: "llm"
      llm:
        prompt: "Analyse ZFI_SLD_CLOSING spool. Was the final FI SLD period closing completed successfully?"
        max_spool_lines: 300

    rollback:
      enabled: true
      action_type: "SUBMIT"
      object_name: "ZFI_SLD_CLOSING"
      async: true
      poll_timeout_sec: 3600
      params:
        - {selname: "BUKRS",  kind: "P", low: "{{company_code}}"}
        - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
        - {selname: "MONAT",  kind: "P", low: "{{period}}"}
        - {selname: "WAERS",  kind: "P", low: "{{currency}}"}
        - {selname: "REOPEN", kind: "P", low: "X"}   # reopen the closed SLD period

