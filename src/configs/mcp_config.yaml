# ──────────────────────────────────────────────────────────────────────────
# Configuration for the SAP Period Close MCP Server.
# The graph_builder.py reads this file to know how to start / connect to
# the MCP server process.
# ──────────────────────────────────────────────────────────────────────────


# ── MCP Server process settings ────────────────────────────────────────────
server:
  # Transport: "stdio" (default, same machine) or "sse" (one shared server).
  #
  #   stdio — the agent SPAWNS A SERVER SUBPROCESS PER RUN. Zero setup, so it is
  #           the default for the CLI, tests and local dev — but N concurrent
  #           company runs mean N interpreters and N sets of SAP connections.
  #   sse   — every run connects to one already-running mcp_server.py, which
  #           pools SAP connections across all of them. Use this for any
  #           multi-run web deployment.
  #
  # Both sides read MCP_TRANSPORT (and MCP_SSE_URL) from the environment first,
  # so a deployment flips transport in .env without editing this file:
  #   MCP_TRANSPORT=sse
  #   MCP_SSE_URL=http://127.0.0.1:8100/sse
  transport: stdio

  # --- stdio transport (used when transport=stdio) ---
  # Command that starts the MCP server. The agent spawns this as a subprocess.
  command: sys.executable
  args:
    - mcp_server.py

  # --- SSE transport (used when transport=sse) ---
  # Where the shared server listens (server side) and where runs find it (client
  # side). Port 8100 stays clear of uvicorn's 8000; bind to 127.0.0.1 unless the
  # server really is remote — these tools execute SAP work and carry no auth.
  sse_host: 127.0.0.1
  sse_port: 8100
  sse_url: http://127.0.0.1:8100/sse

  # Max simultaneously open SAP connections in the shared server (env: SAP_POOL_SIZE).
  # This is the RFC concurrency cap for the WHOLE fleet — each busy connection
  # occupies one SAP dialog work process, so agree the number with Basis. Polling
  # calls are short; only inline-wait SUBMITs (async: false) hold a slot for long.
  pool_size: 8


# ── Tool behaviour ─────────────────────────────────────────────────────────
tools:
  # How often to poll for job completion (seconds)
  poll_interval_seconds: 10

  # Maximum number of polls before treating job as timed-out
  poll_max_attempts: 100

  # SAP background job class: A (normal), B (low), C (high priority)
  default_job_class: "A"


# ── Tools exposed by this server ──────────────────────────────────────────
# Informational only — FastMCP auto-discovers tools via @mcp.tool() decorator.
# Listed here for documentation and for clients that want to validate upfront.
exposed_tools:
  - name: sap_check_period
    description: >
      Pre-check whether a posting period is open and master data is consistent.
      Returns period_open (bool), data_ok (bool), messages list.

  - name: sap_execute_step
    description: >
      Submit an SAP RFC-based period-close step as a background job.
      Polls until the job reaches status F (finished) or A (aborted).
      Returns job_id, job_name, status, success flag, messages.

  - name: sap_read_spool
    description: >
      Read the spool output of a completed SAP background job.
      Output is truncated to max_lines (default 500) before returning
      to avoid flooding the LLM context window.
