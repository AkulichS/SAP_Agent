# Base config — step library, defaults, llm_profiles shared across all companies.
# Merged with per-company company_config and steps list at runtime via config.load_config().
# DO NOT add fiscal_year or period here — those are injected at runtime.

defaults:
  max_retries:       3
  poll_interval_sec: 30
  poll_timeout_sec:  14400      # 4 hours
  test_run:          true
  # Dev/testing only: when true, each run gets a fresh checkpoint thread_id so the
  # same period can be re-run repeatedly without rebooting the server. Leave false in
  # production to keep crash-recovery resume and prevent re-running a finished close.
  # Can also be enabled per-run via env var RESET_EACH_RUN=1.
  reset_each_run:    true

llm_profiles:
  analysis:   {provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", temperature: 0}
  validation: {provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", temperature: 0}

steps:

# ---------------------------------------------------------------------------
# Step schema notes (SUBMIT model + runnable pre_check/validate)
# ---------------------------------------------------------------------------
# SUBMIT always runs as a background job (never an inline GUI SUBMIT), so reports
# that show ALV/lists are safe and their output is always captured to spool:
#   async: true   → main long-running steps; the agent polls then reads the spool.
#   async: false  → the RFC submits the job, waits inline, and returns the spool
#                   in one call (use for short pre_check / validate.run reports).
#
# pre_check can run ANY action mode (TOOLS | FM | BAPI | BDC | SUBMIT):
#   pre_check:
#     enabled: true
#     mode: comparison        # comparison (on rows) | llm (on rows or spool) | skip
#     action_type: SUBMIT
#     object_name: ZSOME_CHECK
#     async: false            # SUBMIT → inline-wait, spool fed to the check
#     params: [...]           # list for FM/BAPI/BDC/SUBMIT, dict for TOOLS
#     comparison: {select: empty, on_pass: execute, on_fail: analyse}
#       # on_fail: execute | skip | analyse   ("llm"/"error" accepted as aliases of analyse)
#
# validate can read the executed step's spool (default) OR run its own check
# action via an optional `run:` block — handy when the main step ran async with
# no useful spool and you must confirm the result by reading a table / running a
# verification report:
#   validate:
#     mode: llm               # keyword | llm
#     run:                    # OPTIONAL — if present, run this and validate ITS output
#       action_type: TOOLS    # TOOLS | FM | BAPI | BDC | SUBMIT
#       object_name: TOOL_READ_TABLE
#       async: false          # SUBMIT here uses inline-wait (returns spool)
#       params: {table: CKMLHD, where: "...", fields: "...", max_rows: 1}
#     keyword: {source: rows, error_patterns: ["error"]}   # source: spool | rows | messages
#     # llm prompts may embed {{spool_text}}, {{messages_text}} or {{rows_text}}
#
# Any failure (pre_check / validate / execute / poll) routes to ONE source-aware
# analysis node. on_error picks its depth and prompts:
#   on_error:
#     mode: explain | diagnose | {pre_check: explain, validate: diagnose}
#       # explain  → one cheap validation-model call over data already in hand (no tools)
#       # diagnose → ReAct agent (analysis model) with SAP tools; can retry/skip/user_input
#       # default depth when omitted: pre_check→explain, validate/execute/poll→diagnose
#     explain_prompt: |       # used by the explain depth (falls back to pre_check.llm.prompt)
#     analysis_guidance: |    # domain hints; feeds BOTH depths
# ---------------------------------------------------------------------------

################################ 1 — ZFK_COMPARISON ############################
  - step_id:     "ZFK_COMPARISON"
    description: "FI Data Comparison & Reconciliation"
    group:       null
    action_type: "SUBMIT"
    object_name: "ZFK_COMPARISON"
    async:       true
    test_run:    true

    params:
      - {selname: "S_BUKRS",  kind: "P", low: "{{company_code}}"}
      - {selname: "P_GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "P_MONAT",  kind: "P", low: "{{period}}"}
      - {selname: "P_REP",  kind: "P", low: "X"}
      - {selname: "P_REQ",  kind: "P", low: ""}
      - {selname: "P_LOG",  kind: "P", low: ""}


    pre_check:
      enabled: false

    validate:
      mode: "keyword"
      keyword:
        ok_patterns:    ["completed", "finished", "successful"]
        error_patterns: ["error", "Error", "abort", "difference"]
        source:         "spool"

    rollback:
      enabled: false   # report-only step; no SAP postings to reverse

    on_error:
      analysis_guidance: |
        Z_FI_COMPARISON reconciles FI data before period close.
        Common issues:
        - Company code {{company_code}} missing customizing.
        - Unposted documents still open in period {{period}}/{{fiscal_year}}.
        Check BKPF: WHERE BUKRS = '{{company_code}}' AND GJAHR = '{{fiscal_year}}'
        AND MONAT = '{{period}}' AND BSTAT = ''.

################################ 2 — KO8G #######################################
  - step_id:     "KO8G"
    description: "CO Actual Settlement: Internal Orders"
    action_type: "SUBMIT"
    object_name: "RKO7KO8G"
    async:       true
    test_run:    false
    group:       null
    poll_timeout_sec: 7200
    params:
      - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
      - {selname: "PERIO",  kind: "P", low: "{{period}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "VAART",  kind: "P", low: "1"}
      - {selname: "AUSF",   kind: "P", low: "X"} 

    pre_check: #----------------------------------------------------------------------
      enabled:     true
      mode:        "llm"  # comparison, llm
      action_type: "SUBMIT"
      object_name: "RKASELRULES_OR"
      async:       false
      params:
        - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
        - {selname: "S_KOSTL", kind: "P", low: ""}

      llm:
        prompt: |
          Check the spool below.

          If the spool contains header lines, separator lines (----), and a message such as
          "List does not contain any data" — that means the check passed (no wrong orders).
          If the spool contains any rows with order numbers, that means
          there are wrong orders and the check failed.
          Answer with a single word: YES if the check passed, NO if wrong orders were found.

          Spool:
          {{spool_text}}
        pass_values: ["yes"]


      # comparison:
      #   select:   "empty"      # empty | non_empty | first | last
      #   on_pass:  "execute"
      #   on_fail:  "analyse"    # execute | skip | analyse  ("llm"/"error" still accepted as aliases)

    validate: #----------------------------------------------------------------------
      mode: "llm"
      llm:
        max_spool_lines: 300
        # Optional override of the analyser system instruction.
        system_prompt: "You are an SAP job-log analyser. Respond ONLY with the JSON object requested. No prose."
        # Use SINGLE braces { } for literal JSON; use {{spool_text}} for the spool placeholder.
        # verdict is derived from error_count when omitted; the errors[] list is preserved for the operator.
        prompt: |
          Respond strictly in the specified format:

          {
            "error_count": integer,
            "errors": [
              {
                "sender": string|null,
                "msg_type": "E"|"A"|"X",
                "msg_num": string|null,
                "message": string
              }
            ]
          }

          Rules:
          - Only messages of types E, A, X count as errors.
          - "sender" extracted from a row like "Sender: ...".
          - "msg_num" has the format 2 letters + 3 digits, e.g. KB101.
          - "message" is located in the "Message text" column.
          - If there are no errors, return {"error_count": 0, "errors": []}

          Text:

          {{spool_text}}

    rollback: #----------------------------------------------------------------------
      enabled: true
      action_type: "SUBMIT"
      object_name: "RKO7KO8G"
      async: true
      test_run: false
      poll_timeout_sec: 3600
      params:
        - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
        - {selname: "PERIO",  kind: "P", low: "{{period}}"}
        - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
        - {selname: "VAART",  kind: "P", low: "1"}
        - {selname: "STOR",   kind: "P", low: "X"}   # reversal flag

    on_error: #----------------------------------------------------------------------
      # Depth per failure source: cheap operator "explain" before the step (the
      # pre-check already holds the offending orders), heavy tool "diagnose" after
      # the step (an unprocessed-orders failure needs SAP investigation).
      mode: {pre_check: explain, validate: diagnose}
      explain_prompt: |
        The settlement-rules report RKASELRULES_OR listed the internal orders below,
        which are missing settlement rules and would block KO8G settlement.
        List the affected order numbers, explain the root cause, and tell the SAP
        operator to maintain settlement rules (KO02) for these orders before KO8G —
        then retry the pre-check, or skip the step if intentional.
      analysis_guidance: |
        KO8G settles CO internal orders for controlling area {{controlling_area}}.
        Common issues:
        - Missing settlement rule: check AUFK (order master) and KO03 for order details.
        - COSS should show secondary cost postings after successful settlement.
        Use TOOL_READ_TABLE: AUFK WHERE KOKRS = '{{controlling_area}}' AND KOSTL IS INITIAL.

################################ 3+4 — S_ALR reports (parallel) #################
  - step_id:     "S_ALR_87013127"
    description: "Cost Centers: Actual/Plan/Variance"
    group:       "co_period_reports"    # parallel with S_ALR_87009712
    action_type: "SUBMIT"
    object_name: "RKSAB000"
    async:       true
    test_run:    true

    params:
      - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "PERBL",  kind: "P", low: "{{period}}"}

    pre_check:
      enabled: false

    validate:
      mode: "keyword"
      keyword:
        ok_patterns:    ["completed", "report", "printed"]
        error_patterns: ["error", "Error", "abort"]
        source:         "spool"

    rollback:
      enabled: false   # report-only; no postings

    on_error:
      analysis_guidance: |
        S_ALR_87013127 generates the CO cost center variance report.
        Common issues: missing cost center data for period, authorization errors.
        Check TKA01 for controlling area settings and COSP for cost totals.

  - step_id:     "S_ALR_87009712"
    description: "CO-PA Actual Line Items Report"
    group:       "co_period_reports"    # parallel with S_ALR_87013127
    action_type: "SUBMIT"
    object_name: "RKEB0601"
    async:       true
    test_run:    true

    params:
      - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "PERBL",  kind: "P", low: "{{period}}"}

    pre_check:
      enabled: false

    validate:
      mode: "keyword"
      keyword:
        ok_patterns:    ["completed", "report"]
        error_patterns: ["error", "Error", "abort"]
        source:         "spool"

    rollback:
      enabled: false   # report-only; no postings

    on_error:
      analysis_guidance: |
        S_ALR_87009712 reports CO-PA actual line items.
        Common issues: CO-PA not active for operating concern, missing value fields.
        Check TKE1 for operating concern settings.

################################ 5 — KP46 #######################################
  - step_id:     "KP46"
    description: "CO Activity Price Planning"
    group:       null
    action_type: "SUBMIT"
    object_name: "RKACRPLN"
    async:       false
    test_run:    true

    params:
      - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "PERAB",  kind: "P", low: "{{period}}"}
      - {selname: "PERAE",  kind: "P", low: "{{period}}"}

    pre_check:
      enabled: false

    validate:
      mode: "keyword"
      keyword:
        ok_patterns:    ["saved", "planned", "completed"]
        error_patterns: ["error", "Error", "authorization"]
        source:         "messages"

    rollback:
      enabled: true
      action_type: "SUBMIT"
      object_name: "RKACRPLN"
      async: false
      params:
        - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
        - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
        - {selname: "PERAB",  kind: "P", low: "{{period}}"}
        - {selname: "PERAE",  kind: "P", low: "{{period}}"}
        - {selname: "DELETE", kind: "P", low: "X"}   # delete planned prices

    on_error:
      analysis_guidance: |
        KP46 plans activity prices for cost centers.
        Common issues: activity type not defined in cost center, version mismatch.
        Check CSLA (activity type) and TKA09 (controlling area version).

################################ 6 — KSW5 #######################################
  - step_id:     "KSW5"
    description: "CO Assessment Cycles"
    group:       null
    action_type: "SUBMIT"
    object_name: "RKABL000"
    async:       true
    test_run:    true
    poll_timeout_sec: 7200

    params:
      - {selname: "KOKRS",   kind: "P", low: "{{controlling_area}}"}
      - {selname: "ABPER",   kind: "P", low: "{{period}}"}
      - {selname: "ABGJAHR", kind: "P", low: "{{fiscal_year}}"}

    pre_check:
      enabled: false

    validate:
      mode: "llm"
      llm:
        prompt: "Analyse KSW5 CO assessment spool. Were all cycles processed without errors? Note any cycles that failed."
        max_spool_lines: 300

    rollback:
      enabled: true
      action_type: "SUBMIT"
      object_name: "RKABL000"
      async: true
      poll_timeout_sec: 3600
      params:
        - {selname: "KOKRS",   kind: "P", low: "{{controlling_area}}"}
        - {selname: "ABPER",   kind: "P", low: "{{period}}"}
        - {selname: "ABGJAHR", kind: "P", low: "{{fiscal_year}}"}
        - {selname: "STORNO",  kind: "P", low: "X"}   # reverse assessment

    on_error:
      analysis_guidance: |
        KSW5 executes CO assessment cycles for controlling area {{controlling_area}}.
        Common issues:
        - Cycle not defined: verify in KSW3 that cycles exist for this period.
        - Sender cost centre has zero costs: check COSP/COSS tables.
        - Receiver tracing factor = 0: check SKF statistical key figures.
        Use TOOL_READ_TABLE: TKA3I WHERE KOKRS = '{{controlling_area}}'.

################################ 7 — KSC5 #######################################
  - step_id:     "KSC5"
    description: "CO Distribution Cycles"
    group:       null
    action_type: "SUBMIT"
    object_name: "RKAV0000"
    async:       true
    test_run:    true

    params:
      - {selname: "KOKRS",   kind: "P", low: "{{controlling_area}}"}
      - {selname: "ABPER",   kind: "P", low: "{{period}}"}
      - {selname: "ABGJAHR", kind: "P", low: "{{fiscal_year}}"}

    pre_check:
      enabled: false

    validate:
      mode: "llm"
      llm:
        prompt: "Analyse KSC5 CO distribution spool. Were all distribution cycles executed successfully?"
        max_spool_lines: 300

    rollback:
      enabled: true
      action_type: "SUBMIT"
      object_name: "RKAV0000"
      async: true
      poll_timeout_sec: 3600
      params:
        - {selname: "KOKRS",   kind: "P", low: "{{controlling_area}}"}
        - {selname: "ABPER",   kind: "P", low: "{{period}}"}
        - {selname: "ABGJAHR", kind: "P", low: "{{fiscal_year}}"}
        - {selname: "STORNO",  kind: "P", low: "X"}   # reverse distribution

    on_error:
      analysis_guidance: |
        KSC5 distributes CO costs between cost centres.
        Common issues:
        - Distribution cycle not configured: check in KSC3.
        - Sender cost centre locked or has no costs.
        Use TOOL_READ_TABLE: TKA3D WHERE KOKRS = '{{controlling_area}}'.

################################ 8 — S_ALR_87013611 #############################
  - step_id:     "S_ALR_87013611"
    description: "Cost Centers: Actual Costs Report"
    group:       null
    action_type: "SUBMIT"
    object_name: "REKSB000"
    async:       true
    test_run:    true

    params:
      - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "PERBL",  kind: "P", low: "{{period}}"}

    pre_check:
      enabled: false

    validate:
      mode: "keyword"
      keyword:
        ok_patterns:    ["completed", "report"]
        error_patterns: ["error", "Error", "abort"]
        source:         "spool"

    rollback:
      enabled: false   # report-only; no postings

    on_error:
      analysis_guidance: |
        S_ALR_87013611 reports actual costs by cost centre.
        Check that COSP/COSS tables have data for period {{period}}/{{fiscal_year}}.

################################ 9 — KSII ########################################
  - step_id:     "KSII"
    description: "Actual Activity Price Calculation"
    group:       null
    action_type: "SUBMIT"
    object_name: "RKSSVFAK"
    async:       true
    test_run:    true

    params:
      - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "PERBIS", kind: "P", low: "{{period}}"}

    pre_check:
      enabled: false

    validate:
      mode: "llm"
      llm:
        prompt: "Analyse KSII actual price calculation spool. Were prices calculated for all activity types?"
        max_spool_lines: 300

    rollback:
      enabled: true
      action_type: "SUBMIT"
      object_name: "RKSSVFAK"
      async: true
      poll_timeout_sec: 3600
      params:
        - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
        - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
        - {selname: "PERBIS", kind: "P", low: "{{period}}"}
        - {selname: "STORNO", kind: "P", low: "X"}   # reverse price calculation

    on_error:
      analysis_guidance: |
        KSII calculates actual activity prices for controlling area {{controlling_area}}.
        Common issues:
        - Activity type not confirmed: check CSLA, verify activity quantity posted.
        - Version mismatch: check TKA09 (controlling version settings).
        Use TOOL_READ_TABLE: CSSL WHERE KOKRS = '{{controlling_area}}' AND GJAHR = '{{fiscal_year}}'.

################################ 10 — CO88 #######################################
  - step_id:     "CO88"
    description: "Actual Settlement: Production/Process Orders"
    group:       null
    action_type: "SUBMIT"
    object_name: "RCOARSR0"
    async:       true
    test_run:    true
    poll_timeout_sec: 14400

    params:
      - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "ABPER",  kind: "P", low: "{{period}}"}

    pre_check:
      enabled: false

    validate:
      mode: "llm"
      llm:
        prompt: "Analyse CO88 production order settlement spool. Were all orders settled? Note any errors or unsettled orders."
        max_spool_lines: 500

    rollback:
      enabled: true
      action_type: "SUBMIT"
      object_name: "RCOARSR0"
      async: true
      poll_timeout_sec: 7200
      params:
        - {selname: "KOKRS",  kind: "P", low: "{{controlling_area}}"}
        - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
        - {selname: "ABPER",  kind: "P", low: "{{period}}"}
        - {selname: "STORNO", kind: "P", low: "X"}   # reverse production order settlement

    on_error:
      analysis_guidance: |
        CO88 settles production/process orders for controlling area {{controlling_area}}.
        Common issues:
        - Settlement rule missing: check AUFK (order master) and CO02/COR2.
        - Material ledger active: settlement may depend on CKMLCP completion.
        - Order status TECO required before settlement.
        Use TOOL_READ_TABLE: AUFK WHERE KOKRS='{{controlling_area}}' AND AUTYP IN ('10','20').

################################ 11 — CKMLCP #####################################
  - step_id:     "CKMLCP"
    description: "Material Ledger Closing: Actual Costing"
    group:       null
    action_type: "SUBMIT"
    object_name: "CKMLCP"
    async:       true
    test_run:    true
    poll_timeout_sec: 14400

    params:
      - {selname: "BUKRS",  kind: "P", low: "{{company_code}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "POPER",  kind: "P", low: "{{period}}"}

    pre_check:
      enabled:     true
      mode:        "comparison"
      action_type: "TOOLS"
      object_name: "TOOL_READ_TABLE"
      params:
        table:    "CKMLHD"
        where:    "BUKRS EQ '{{company_code}}' AND POPER EQ '{{period}}' AND BDATJ EQ '{{fiscal_year}}'"
        fields:   "BUKRS,POPER,BDATJ,MLJAHR,STATUS"
        max_rows: 1
      comparison:
        field:    "STATUS"
        operator: "ne"
        value:    "50"                  # 50 = already closed
        on_pass:  "execute"
        on_fail:  "skip"

    validate:
      mode: "llm"
      llm:
        prompt: "Analyse CKMLCP material ledger closing spool. Was actual costing completed for all materials?"
        max_spool_lines: 500

    rollback:
      enabled: true
      action_type: "SUBMIT"
      object_name: "CKMLCP"
      async: true
      poll_timeout_sec: 7200
      params:
        - {selname: "BUKRS",  kind: "P", low: "{{company_code}}"}
        - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
        - {selname: "POPER",  kind: "P", low: "{{period}}"}
        - {selname: "REOPEN", kind: "P", low: "X"}   # reopen ML period

    on_error:
      analysis_guidance: |
        CKMLCP closes the Material Ledger for company code {{company_code}}.
        Common issues:
        - CO88 must complete before CKMLCP (production order settlement feeds ML).
        - Unconfirmed quantities on production orders.
        - Check CKMLHD for current ML period status.
        Use TOOL_READ_TABLE: CKMLHD WHERE BUKRS = '{{company_code}}' AND POPER = '{{period}}'.

################################ 12 — CKMLCPAVR ##################################
  - step_id:     "CKMLCPAVR"
    description: "Material Ledger: Revaluation at Actual Prices"
    group:       null
    action_type: "SUBMIT"
    object_name: "CKMLCPAVR"
    async:       true
    test_run:    true
    poll_timeout_sec: 7200

    params:
      - {selname: "BUKRS",  kind: "P", low: "{{company_code}}"}
      - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
      - {selname: "POPER",  kind: "P", low: "{{period}}"}

    pre_check:
      enabled: false

    validate:
      mode: "llm"
      llm:
        prompt: "Analyse CKMLCPAVR revaluation spool. Were all materials revalued at actual prices successfully?"
        max_spool_lines: 300

    rollback:
      enabled: true
      action_type: "SUBMIT"
      object_name: "CKMLCPAVR"
      async: true
      poll_timeout_sec: 3600
      params:
        - {selname: "BUKRS",  kind: "P", low: "{{company_code}}"}
        - {selname: "GJAHR",  kind: "P", low: "{{fiscal_year}}"}
        - {selname: "POPER",  kind: "P", low: "{{period}}"}
        - {selname: "STORNO", kind: "P", low: "X"}   # reverse revaluation postings

    on_error:
      analysis_guidance: |
        CKMLCPAVR revalues inventory at actual costing prices.
        Must run AFTER CKMLCP (actual costing closing).
        Common issues: materials without actual prices, price determination errors.
        Check CKMLHD status first (must be status 40+ for revaluation to proceed).

################################ 13 — FB03 (document verification) ###############
  - step_id:     "FB03"
    description: "FI Closing Documents Verification"
    group:       null
    action_type: "TOOLS"
    object_name: "TOOL_READ_TABLE"
    async:       false

    params:
      table:    "BKPF"
      where:    "BUKRS EQ '{{company_code}}' AND GJAHR EQ '{{fiscal_year}}' AND MONAT EQ '{{period}}' AND BLART EQ 'SA'"
      fields:   "BUKRS,BELNR,GJAHR,MONAT,BLART,BSTAT"
      max_rows: 20

    pre_check:
      enabled: false

    validate:
      mode: "keyword"
      keyword:
        ok_patterns:    []              # any result (count > 0) means docs exist
        error_patterns: ["error", "Error", "not authorized"]
        source:         "messages"

    rollback:
      enabled: false   # read-only verification step; no postings to reverse

    on_error:
      analysis_guidance: |
        FB03 verifies that FI closing documents (type SA) were posted for
        company code {{company_code}}, period {{period}}/{{fiscal_year}}.
        If no documents found, check whether CKMLCPAVR posted the revaluation entries.
        Use TOOL_READ_TABLE: BKPF WHERE BUKRS='{{company_code}}' AND MONAT='{{period}}'.

