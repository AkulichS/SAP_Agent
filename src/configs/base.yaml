      '
- step_id: CKMLCP
  description: 'Material Ledger Closing: Actual Costing'
  group: null
  action_type: SUBMIT
  object_name: CKMLCP
  async: true
  test_run: true
  poll_timeout_sec: 14400
  params:
  - selname: BUKRS
    kind: P
    low: '{{company_code}}'
  - selname: GJAHR
    kind: P
    low: '{{fiscal_year}}'
  - selname: POPER
    kind: P
    low: '{{period}}'
  pre_check:
    enabled: true
    mode: comparison
    action_type: TOOLS
    object_name: TOOL_READ_TABLE
    params:
      table: CKMLHD
      where: BUKRS EQ '{{company_code}}' AND POPER EQ '{{period}}' AND BDATJ EQ '{{fiscal_year}}'
      fields: BUKRS,POPER,BDATJ,MLJAHR,STATUS
      max_rows: 1
    comparison:
      field: STATUS
      operator: ne
      value: '50'
      on_pass: execute
      on_fail: skip
  validate:
    mode: llm
    llm:
      prompt: Analyse CKMLCP material ledger closing spool. Was actual costing completed
        for all materials?
      max_spool_lines: 500
  rollback:
    enabled: true
    action_type: SUBMIT
    object_name: CKMLCP
    async: true
    poll_timeout_sec: 7200
    params:
    - selname: BUKRS
      kind: P
      low: '{{company_code}}'
    - selname: GJAHR
      kind: P
      low: '{{fiscal_year}}'
    - selname: POPER
      kind: P
      low: '{{period}}'
    - selname: REOPEN
      kind: P
      low: X
  on_error:
    analysis_guidance: 'CKMLCP closes the Material Ledger for company code {{company_code}}.

      Common issues:

      - CO88 must complete before CKMLCP (production order settlement feeds ML).

      - Unconfirmed quantities on production orders.

      - Check CKMLHD for current ML period status.

      Use TOOL_READ_TABLE: CKMLHD WHERE BUKRS = ''{{company_code}}'' AND POPER = ''{{period}}''.

      '
