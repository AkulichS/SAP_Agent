globals:
  defaults:
    max_retries: 3
    poll_interval_sec: 30
    poll_timeout_sec: 14400
    test_run: true
    reset_each_run: true
  llm_profiles:
    analysis:
      provider: groq
      model: openai/gpt-oss-120b
      temperature: 0
      tool_mode: native
    validation:
      provider: openrouter
      model: meta-llama/llama-3.3-70b-instruct
      temperature: 0
  analysis_defaults:
    max_tool_calls: 8
    role: 'You are an SAP period-close error analyst. You diagnose why a closing step
      failed, using read-only SAP tools, then report the root cause and how the operator
      can fix it.

      '
    tools: 'You have these read-only diagnostic tools (call one at a time):

      - sap_read_table(table, where, fields, max_rows) — read any SAP table by WHERE
      clause.

      - sap_read_job_log(job_name, job_id, max_lines) — read the SM37 runtime job
      log (holds the abort reason and the last messages before an aborted job terminated).

      - sap_read_spool(job_name, job_id, max_lines) — read the spool (report list
      output) of a completed background job.

      - sap_job_status(job_name, job_id) — check the status of a background job.

      - sap_check_period(action_type, object_name, params_json) — check whether a
      posting period is open.

      '
    rules: "- Never fabricate data. Report only what the tools actually return.\n\
      - Make ONE tool call at a time and wait for its result before the next.\n- Do\
      \ not repeat an identical tool call with the same arguments.\n- If a tool returns\
      \ no data for an object, flag it (it may not exist or the key may\n  be formatted\
      \ wrong) rather than guessing.\n- If you cannot determine a root cause from\
      \ the available data, say so and set\n  status to \"undetermined\" (or \"partial\"\
      \ when only some objects are unresolved);\n  suggest a manual check.\n- Respond\
      \ in the same language as the error messages in the task message.\n"
steps:
- step_id: ZFK_COMPARISON
  description: FI Data Comparison & Reconciliation
  group: null
  action_type: SUBMIT
  object_name: ZFK_COMPARISON
  async: true
  test_run: true
  params:
  - selname: S_BUKRS
    kind: P
    low: '{{company_code}}'
  - selname: P_GJAHR
    kind: P
    low: '{{fiscal_year}}'
  - selname: P_MONAT
    kind: P
    low: '{{period}}'
  - selname: P_REP
    kind: P
    low: X
  - selname: P_REQ
    kind: P
    low: ''
  - selname: P_LOG
    kind: P
    low: ''
  pre_check:
    enabled: false
  validate:
    mode: llm
    keyword:
      ok_patterns:
      - completed
      - finished
      - successful
      error_patterns:
      - error
      - Error
      - abort
      - difference
      source: spool
    run:
      action_type: SUBMIT
      object_name: ''
    llm:
      prompt: '# header 1

        ## header 2


        text row 1

        text row 2'
  rollback:
    enabled: false
  on_error:
    analysis_guidance: 'Z_FI_COMPARISON reconciles FI data before period close.

      Common issues:

      - Company code {{company_code}} missing customizing.

      - Unposted documents still open in period {{period}}/{{fiscal_year}}.

      Check BKPF: WHERE BUKRS = ''{{company_code}}'' AND GJAHR = ''{{fiscal_year}}''

      AND MONAT = ''{{period}}'' AND BSTAT = ''''.

      '
    mode: {}
- step_id: KO8G
  description: 'CO Actual Settlement: Internal Orders'
  action_type: SUBMIT
  object_name: RKO7KO8G
  async: true
  test_run: false
  poll_timeout_sec: 7200
  params:
  - selname: KOKRS
    kind: P
    low: '{{controlling_area}}'
  - selname: PERIO
    kind: P
    low: '{{period}}'
  - selname: GJAHR
    kind: P
    low: '{{fiscal_year}}'
  - selname: VAART
    kind: P
    low: '1'
  - selname: AUSF
    kind: P
    low: X
  - selname: VARIANT
    kind: P
    low: TEST
  pre_check:
    enabled: true
    mode: llm
    action_type: SUBMIT
    object_name: RKASELRULES_OR
    async: false
    params:
    - selname: KOKRS
      kind: P
      low: '{{controlling_area}}'
    - selname: S_KOSTL
      kind: S
      low: ''
    - selname: VARIANT
      kind: P
      low: TEST
    llm:
      prompt: 'Check the spool below.


        If the spool contains header lines, separator lines (----), and a message
        such as

        "List does not contain any data" — that means the check passed (no wrong orders).

        If the spool contains any rows with order numbers, that means

        there are wrong orders and the check failed.

        Answer with a single word: YES if the check passed, NO if wrong orders were
        found.


        Spool:

        {{spool_text}}

        '
      pass_values:
      - 'yes'
  validate:
    combine: all_pass
    checks:
    # Check 1 — read the settlement job's spool and have the LLM count E/A/X errors.
    - name: check_1
      required: true
      action_type: TOOLS
      object_name: TOOL_READ_JOB_SPOOL
      params:
        jobname: '{{job_name}}'
        jobcount: '{{job_id}}'
      mode: llm
      llm:
        max_spool_lines: 300
        system_prompt: You are an SAP job-log analyser. Respond ONLY with the JSON
          object requested. No prose.
        prompt: "Respond strictly in the specified format:\n\n{\n  \"error_count\":\
          \ integer,\n  \"errors\": [\n    {\n      \"sender\": string|null,\n     \
          \ \"msg_type\": \"E\"|\"A\"|\"X\",\n      \"msg_num\": string|null,\n    \
          \  \"message\": string\n    }\n  ]\n}\n\nRules:\n- Only messages of types\
          \ E, A, X count as errors.\n- \"sender\" extracted from a row like \"Sender:\
          \ ...\".\n- \"msg_num\" has the format 2 letters + 3 digits, e.g. KB101.\n\
          - \"message\" is located in the \"Message text\" column.\n- If there are\
          \ no errors, return {\"error_count\": 0, \"errors\": []}\n\nText:\n\n{{spool_text}}\n"
    # Check 2 — confirm every settled order now carries a zero balance. Reads the CO
    # totals table for any order line with a non-zero value; comparison passes only
    # when that read is EMPTY. NOTE: adjust `table`/`fields`/`where` to your system's
    # settlement object (COSS/COSP totals, the relevant value type/period selection).
    - name: check_2
      required: true
      action_type: TOOLS
      object_name: TOOL_READ_TABLE
      params:
        table: COSS
        fields: OBJNR,WRTTP,PERBL,WKG001
        where: KOKRS = '{{controlling_area}}' AND GJAHR = '{{fiscal_year}}' AND WRTTP
          = '04' AND WKG001 <> 0
        max_rows: '999'
      mode: comparison
      comparison:
        select: empty
  rollback:
    enabled: true
    action_type: SUBMIT
    object_name: RKO7KO8G
    async: true
    test_run: false
    poll_timeout_sec: 3600
    params:
    - selname: KOKRS
      kind: P
      low: '{{controlling_area}}'
    - selname: PERIO
      kind: P
      low: '{{period}}'
    - selname: GJAHR
      kind: P
      low: '{{fiscal_year}}'
    - selname: VAART
      kind: P
      low: '1'
    - selname: STOR
      kind: P
      low: X
    - selname: VARIANT
      kind: P
      low: TEST
  on_error:
    mode:
      pre_check: explain
      validate: diagnose
    analysis:
      goal: 'Diagnose the root cause for each failed order and provide a clear fix.
        Every

        failed order listed in the task message must be accounted for in the final
        result.

        '
      context_template: 'KO8G performs periodic settlement of CO orders for controlling
        area {{controlling_area}}, fiscal year {{fiscal_year}}, period {{period}}.

        After the settlement run, validation detected internal orders that were NOT
        settled due to errors. The failed orders and the KO8G error messages are given
        in the task message below.

        '
      instructions: "## Diagnostic Procedure (follow steps in order; do NOT skip to\
        \ assumptions)\n\n### Step 1: Retrieve order master data\nUse sap_read_table\
        \ on table AUFK, fields:\n  AUFNR, PHAS0, PHAS1, PHAS2, PHAS3, LOEKZ\nWHERE\
        \ AUFNR IN (<the failed order numbers from the Errors list>).\n\nOrder-number\
        \ formatting (apply to each order taken ONLY from the \"Errors:\" block):\n\
        - If digits only → left-pad with zeros to 12 characters (e.g. a 5-digit id\
        \ ddddd becomes 0000000ddddd).\n- If contains any letter → use exactly as\
        \ provided, unchanged.\n  \n### Step 2: Check order status (most common cause)\n\
        | PHAS1 | PHAS2 | PHAS3 | LOEKZ | System Status | Settlement allowed? |\n\
        |-------|-------|-------|-------|---------------|---------------------|\n\
        | 1 | 0 | 0 | (empty) | REL (Released / ТЗКР)            | YES |\n| 0 | 0\
        \ | 0 | (empty) | CRTD (Created / ТЗАК)            | NO — not yet released\
        \ |\n| 1 | 1 | 0 | (empty) | TECO (Technically closed / ТКЗК) | NO — technically\
        \ closed |\n| any | any | 1 | (empty) | CLSD (Closed / ЗАКР)          | NO\
        \ — order is closed |\n| any | any | any | X   | DLFL (Deletion flag / УДАЛ)\
        \      | NO — marked for deletion |\nAlso: PHAS0 = 'X' - means order status\
        \ Open → NO — cannot be settled yet.\n\n### Step 3: Check settlement rule\
        \ existence\nUse sap_read_table on table COBRB, fields OBJNR, PROZS\nWHERE\
        \ OBJNR IN (<\"OR\" + AUFNR as stored in AUFK>).\n- No records → settlement\
        \ rule missing → fix in KO02 (Settlement Rule tab).\n- Records found but PROZS\
        \ does not sum to 100 → settlement rule incomplete.\n\n### Step 4: Cross-reference\
        \ with error messages\nMatch findings against the KO8G error messages in the\
        \ task message to confirm the root cause for each order, then group orders\
        \ that share the same fix.\n"
      tools: 'You have these read-only diagnostic tools (call one at a time):

        - sap_read_table(table, where, fields, max_rows) — read any SAP table by WHERE
        clause.'
      rules: '- Never fabricate data. Report only what the tools actually return.

        - Make ONE tool call at a time and wait for its result before the next.

        - Do not repeat an identical tool call with the same arguments.

        - If a tool returns no data for an object, flag it (it may not exist or the
        key may be formatted wrong) rather than guessing.

        - If you cannot determine a root cause from the available data, say so and
        set  status to "undetermined" (or "partial" when only some objects are unresolved);   suggest
        a manual check.

        '
    explain_prompt: 'The settlement-rules report RKASELRULES_OR listed the internal
      orders below, which are missing settlement rules and would block KO8G settlement.

      List the affected order numbers, explain the root cause, and tell the SAP operator
      to maintain settlement rules (KO02) for these orders before KO8G — then retry
      the pre-check, or skip the step if intentional.

      '
  enabled: true
